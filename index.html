<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>AfripotCuisine</title>
    <meta name="description" content="AfriPot Cuisine is an authentic African restaurant in Kigali, Rwanda. Experience traditional flavors — Mbuzi Choma, Chicken Luwombo, Grilled Tilapia and more. Book your table today." />
    <meta name="keywords" content="AfriPot Cuisine, African restaurant Kigali, Rwandan food, authentic African food, Mbuzi Choma, Chicken Luwombo, restaurant Kigali Rwanda" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://afripotcuisine.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="AfriPot Cuisine" />
    <meta property="og:title" content="AfriPot Cuisine — Authentic African Restaurant in Kigali" />
    <meta property="og:description" content="Experience traditional African flavors where culture and cuisine meet. Dine with us in Kigali, Rwanda." />
    <meta property="og:url" content="https://afripotcuisine.com/" />
    <meta property="og:image" content="https://afripotcuisine.com/favicon.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AfriPot Cuisine — Authentic African Restaurant in Kigali" />
    <meta name="twitter:description" content="Experience traditional African flavors where culture and cuisine meet. Dine with us in Kigali, Rwanda." />
    <meta name="twitter:image" content="https://afripotcuisine.com/favicon.png" />

    <!-- Structured Data: Local Business (helps Google show your restaurant in search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "AfriPot Cuisine",
      "url": "https://afripotcuisine.com",
      "description": "Authentic African restaurant in Kigali, Rwanda. Celebrating traditional flavors and cultural heritage.",
      "servesCuisine": ["African", "Rwandan"],
      "image": "https://afripotcuisine.com/favicon.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kigali",
        "addressCountry": "RW"
      },
      "sameAs": []
    }
    </script>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;700&family=Gilda+Display&family=Allura&family=Caveat:wght@400;500;600;700&family=Cinzel:wght@400..900&family=Indie+Flower&family=Swanky+and+Moo+Moo&family=Julius+Sans+One&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
